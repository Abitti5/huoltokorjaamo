<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tietokonehuolto</title>

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;

    margin: 100;
    font-family: Arial, sans-serif;

    background-color: #111;
    color: white;
}

/* laatikko */
.container {
    max-width: 600px;
    padding: 30px;

    background-color: rgba(0, 0, 0, 0.7);
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);

    text-align: center;
}

/* otsikko */
h1 {
    font-size: 3em;
    color: #00ffcc;
    text-shadow: 2px 2px 5px black;
}

/* alaotsikko */
.subtitle {
    font-size: 1.2em;
    color: #ccc;
    margin-bottom: 20px;
}

/* nappi */
.button {
    display: inline-block;
    padding: 12px 25px;
    background-color: #00ccff;
    color: black;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.2s;
}

.button:hover {
    background-color: #00ffcc;
}

h2 {
    color: #00ccff;
    margin-top: 20px;
}

p {
    color: #ddd;
}
</style>

</head>

<body>

<div class="container">

<h1>Tietokonehuolto</h1>
<p class="subtitle">Nopea ja luotettava tietokoneiden korjaus</p>

<a href="#" class="button">Ota yhteyttä</a>

<h2>Palvelut</h2>
<p>Virusten poisto</p>
<p>Windows asennus</p>
<p>Koneen nopeutus</p>

<h2>Hinnasto</h2>
<p>Perushuolto: 50€</p>
<p>Windows asennus: 40€</p>

<h2>Yhteystiedot</h2>
<p>Sähköposti: esimerkki@email.com</p>

</div>

</body>
</html>
